<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 퀴즈</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #1e293b;
    }

    .quiz-card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }

    .quiz-badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0284c7;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .quiz-question {
      font-size: 1.6rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.4;
      margin-bottom: 28px;
      word-break: keep-all;
    }

    .quiz-btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .quiz-btn:hover {
      background: #0369a1;
      transform: translateY(-2px);
    }

    .quiz-btn:active {
      transform: scale(0.98);
    }

    .answer-box {
      margin-top: 28px;
      padding: 20px;
      background: #f0fdf4;
      border: 2px solid #86efac;
      border-radius: 16px;
      display: none;
    }

    .answer-text {
      font-size: 1.4rem;
      font-weight: 800;
      color: #166534;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <span class="quiz-badge">오늘의 퀴즈 🏝️</span>
    <h1 class="quiz-question">제주에서 가장 높은 산은?</h1>
    
    <button id="showBtn" class="quiz-btn" type="button">정답 보기</button>

    <div id="answer" class="answer-box">
      <p class="answer-text">정답: 한라산 🏔️</p>
    </div>
  </div>

  <script>
    const showBtn = document.getElementById('showBtn');

    showBtn.addEventListener('click', function() {
      // 정답 상자를 화면에 보여줍니다.
      const answerEl = document.getElementById('answer');
      answerEl.style.display = 'block';
    });
  </script>
</body>
</html>
